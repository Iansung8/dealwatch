# dealwatch on Synology DSM 7（Container Manager），也適用任何有 Docker 的 Linux 主機。
# 部署步驟見 synology/README.md。先把 .env.example 複製成 .env 並填好。
#
# 兩個容器共用同一個網路空間：dealwatch 透過 127.0.0.1:9222 遙控 browser 裡的 Chromium，
# 這個除錯埠不對外開放。對外只開兩個埠：網頁介面，以及遠端看瀏覽器畫面用的埠。
services:
  # 給 Walmart 用的 Chromium。它有畫面，可以從別台電腦用瀏覽器連進來看，
  # 遇到人機驗證或想登入 Walmart 帳號時就從這裡操作。
  browser:
    image: ${CHROMIUM_IMAGE:-lscr.io/linuxserver/chromium:latest}
    container_name: dealwatch-browser
    hostname: dealwatch-browser
    environment:
      - PUID=${PUID:-1026}
      - PGID=${PGID:-100}
      - TZ=${TZ:-America/Chicago}
      - CHROME_CLI=--remote-debugging-port=9222 --user-data-dir=/config/dealwatch-profile --no-first-run --no-default-browser-check about:blank
      # 遠端畫面的登入帳密；密碼跟網頁介面共用同一個
      - CUSTOM_USER=${VIEW_USER:-dealwatch}
      - PASSWORD=${UI_PASSWORD:?Set UI_PASSWORD in .env before starting}
    volumes:
      # Chromium 設定檔與快取，寫入頻繁；NAS 有 SSD 儲存空間時可用 BROWSER_CONFIG_DIR 指過去。
      # 資料夾不存在就拒絕啟動，免得儲存空間沒掛上時 docker 自己在系統分割區建一個空的
      - type: bind
        source: ${BROWSER_CONFIG_DIR:-./data/browser}
        target: /config
        bind:
          create_host_path: false
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${HOST_UI_PORT:-8787}:8787"
      - "${HOST_BIND_IP:-127.0.0.1}:${HOST_VIEW_PORT:-3001}:3001"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined   # 舊核心的 NAS 上 Chromium 需要
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:9222/json/version >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  dealwatch:
    image: node:22-alpine
    container_name: dealwatch
    network_mode: "service:browser"
    depends_on:
      browser:
        condition: service_healthy
    working_dir: /app
    command: ["node", "dealwatch.mjs", "ui"]
    env_file: .env
    environment:
      - TZ=${TZ:-America/Chicago}
      - UI_PASSWORD=${UI_PASSWORD:?Set UI_PASSWORD in .env before starting}
      - UI_HOST=0.0.0.0
      - UI_PORT=8787
      - DEALWATCH_CDP_URL=http://127.0.0.1:9222
      - BROWSER_VIEW_PORT=${HOST_VIEW_PORT:-3001}
    volumes:
      - ./:/app:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
